name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure supported npm
        run: npm install --global npm@^11.15.0

      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Verify npm wrapper
        run: node bin/minimax-statusline.js --version | grep -Fx "minimax-statusline 0.2.1"

      - name: Publish npm package
        run: npm publish --access public

      - name: Create source tarball
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='dist' --exclude='node_modules' \
              --exclude='web/.next' --exclude='web/.vercel' \
              --exclude='*.vsix' --exclude='web/node_modules' \
              -czf "dist/claude-statusline-${{ github.ref_name }}.tar.gz" \
              -C "$GITHUB_WORKSPACE/.." \
              "$(basename "$GITHUB_WORKSPACE")"

      - name: Compute SHA256
        id: hash
        run: |
          echo "sha256=$(sha256sum dist/*.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*.tar.gz
          body: |
            See [CHANGELOG.md](https://github.com/liush2yuxjtu/minimax-statusline/blob/main/CHANGELOG.md) for what's new.
            SHA256: `${{ steps.hash.outputs.sha256 }}`
